name: Clean DXVK 2.7.1 native ARM64 comparison
on:
  workflow_dispatch:
  push:
    branches: ['experiment/wow-dxvk-271-native']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget unzip xz-utils meson ninja-build python3 pkg-config zstd glslang-tools

      - name: Install LLVM-MinGW ARM64 native
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' https://api.github.com/repos/mstorsjo/llvm-mingw/releases/assets/312752406 -o llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo '3aed6fa47be909884cb3e5634d6b7254604d7104832d6312f8435fb23d5a9bab  llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz' | sha256sum --check
          tar -xf llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned upstream DXVK 2.7.1
        run: |
          git clone --recursive --branch v2.7.1 --depth 1 https://github.com/doitsujin/dxvk.git dxvk
          test "$(git -C dxvk rev-parse HEAD)" = "c3dd74be6baec53786d4e064a572185b70347a17"
          python3 scripts/apply_marker.py dxvk --build-id "$GITHUB_SHA"
          python3 scripts/audit_source.py
      - name: Cross compile clean native ARM64 DLLs
        run: |
          meson setup dxvk/build-arm64-native dxvk --cross-file "$GITHUB_WORKSPACE/arm64-native.txt" -Dbuildtype=release
          ninja -C dxvk/build-arm64-native -j2 src/d3d11/d3d11.dll src/dxgi/dxgi.dll
      - name: Download verified clean 2.3.1 control
        uses: actions/download-artifact@v4
        with:
          name: dxvk-2.3.1-WOW-CUSTOM-ARM64-NATIVE-bcec80c1e07531af49cdb169d378c982b7fc42ab
          run-id: 42409437829
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: control-source
      - name: Download pinned container originals
        run: |
          curl -fL https://raw.githubusercontent.com/ashmerra/wehavephones/f2319e428d8d02f2be88d4ca609bcae61f4fb469/app/src/main/assets/dxwrapper/aarch64/dxvk-2.3.1.tzst -o stock.tzst
          mkdir stock-unpack
          tar --zstd -xf stock.tzst -C stock-unpack
      - name: Audit PE compatibility and package automatic switchers
        run: |
          python3 scripts/package.py
          cp dxvk/build-arm64-native/meson-logs/meson-log.txt out/source/
          cp scripts/apply_marker.py scripts/audit_source.py arm64-native.txt out/source/
          cp .github/workflows/Build.yml out/source/BUILD.yml
          {
            echo "Upstream: c3dd74be6baec53786d4e064a572185b70347a17 DXVK v2.7.1"
            echo "Repository commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Target: native ARM64 (not ARM64EC). LLVM-MinGW 20251104 UCRT."
            echo "Custom performance patches: NONE. Tablet validation: PENDING."
            git -C dxvk submodule status --recursive
          } > out/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clean-stage-${{ github.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error
  verify:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clean-stage-${{ github.sha }}
          path: package
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile unpublished installer test executables
        shell: cmd
        run: |
          cl /nologo /W4 /DTESTING package\source\helper-271.c /Fepackage\dxvk-test-check.exe advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /DTESTING package\source\helper-231.c /Fepackage\control-231\dxvk-test-check.exe advapi32.lib
      - name: Test install rollback restore and version switching
        shell: pwsh
        run: |
          python tools/test_launcher.py package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_launcher.py package/control-231
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_switch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item package/dxvk-test-check.exe, package/control-231/dxvk-test-check.exe
          Remove-Item package/rollback, package/control-231/rollback, package/baseline -Recurse
          'PASS: native ARM64 PE, export compatibility, payload hashes, installer rollback and version switching. Tablet performance: not tested.' | Out-File -Encoding utf8 package/TEST-RESULTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WOW-CLEAN-DXVK-231-vs-271-ARM64-${{ github.sha }}
          path: package/
          retention-days: 30
          if-no-files-found: error
