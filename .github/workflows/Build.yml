
name: DXVK ARM64EC baseline build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget unzip xz-utils meson ninja-build python3 pkg-config

      - name: Install LLVM-MinGW ARM64EC
        run: |
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20251104/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20251104-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install glslang
        run: |
          wget -q https://github.com/KhronosGroup/glslang/releases/download/master-tot/glslang-master-linux-Release.zip
          unzip -q glslang-master-linux-Release.zip -d glslang
          echo "$PWD/glslang/bin" >> "$GITHUB_PATH"

      - name: Checkout DXVK v2.3.1
        run: |
          git clone --recursive --branch v2.3.1 --depth 1 https://github.com/doitsujin/dxvk.git dxvk

      - name: Fix duplicate D3D9 definition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("dxvk/src/d3d9/d3d9_include.h")
          source = path.read_text()

          pattern = (
              r"typedef\s+struct\s+"
              r"_D3DDEVINFO_RESOURCEMANAGER\s*\{"
              r"[^{}]*\}\s*"
              r"D3DDEVINFO_RESOURCEMANAGER\s*;"
          )

          patched, count = re.subn(pattern, "", source)

          if count != 1:
              raise SystemExit(
                  f"Expected one definition, found {count}. "
                  "Source file was not modified."
              )

          path.write_text(patched)
          print("Duplicate D3D9 definition removed.")
          PY

      - name: Cross compile baseline
        run: |
          meson setup dxvk/build-arm64ec dxvk \
            --cross-file "$GITHUB_WORKSPACE/arm64ec.txt" \
            -Dbuildtype=release
          ninja -C dxvk/build-arm64ec -j 2

      - name: Collect DLLs
        run: |
          mkdir -p out
          find dxvk/build-arm64ec -type f -iname '*.dll' -exec cp -v {} out/ \;
          test -n "$(find out -name '*.dll' -print -quit)"
          sha256sum out/*.dll > out/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-2.3.1-arm64ec-baseline-UNTESTED
          path: out/
